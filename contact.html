<section class="page-hero">
  <h1>お問い合わせ</h1>
  <p>工事のご相談・お見積り・採用についてお気軽にご連絡ください。</p>
</section>

<section class="section contact">
  <div class="container">

    <h2>お電話でのお問い合わせ</h2>
    <p class="section-lead">お急ぎの場合はお電話が確実です。</p>

    <a class="contact-tel" href="tel:058-391-8831">📞 058-XXX-XXXX</a>

    <h2 style="margin-top:40px;">メールフォームでのお問い合わせ</h2>

    <form action="mailto:info@example.com" method="post" enctype="text/plain" class="contact-form">

      <label>お名前</label>
      <input type="text" name="name" required>

      <label>メールアドレス</label>
      <input type="email" name="email" required>

      <label>電話番号（任意）</label>
      <input type="tel" name="tel">

      <label>お問い合わせ内容</label>
      <textarea name="message" rows="6" required></textarea>

      <button type="submit" class="btn primary" style="margin-top:20px;">送信する</button>
    </form>

  </div>
</section>
